name: タスク
description: docs/PHASES.md のタスク 1 つ（PR 1 本で終わる粒度）
title: "[タスク番号] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: 何を作るか。SPEC で決まっていない点は「要確認:」と書く。
    validations:
      required: true
  - type: input
    id: phase-task
    attributes:
      label: PHASES のタスク番号
      placeholder: 1-3
    validations:
      required: true
  - type: input
    id: spec-sections
    attributes:
      label: SPEC.md の参照セクション
      placeholder: §8.1、§8.2
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 受け入れ条件
      description: テストで確認できる形で書く。
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 範囲外のこと
      description: この issue でやらないこと。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依存する issue
      description: "`- #番号` を 1 行に 1 つ。なければ「なし」。/next-task がこの欄を読む。"
      value: なし
    validations:
      required: true
